# Google Play App Signing certificate SHA-256 (lowercase hex, no colons).
# Play Console → Setup → App integrity → App signing key certificate.
# Or: ./scripts/extract_apk_signing_cert.sh <apk-from-play-store>
playAppSigningCertSha256=D3:0C:73:DF:72:09:FC:38:EA:50:C0:F5:20:30:F5:B4:DB:4D:89:24:40:FC:78:19:4A:27:F0:B2:9C:17:4C:D5

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable D8 desugaring for better compatibility
android.enableD8.desugaring=true

# Improve build performance
org.gradle.parallel=true
org.gradle.caching=true

# Fix WebView issues on Samsung devices
android.useAndroidX=true
android.enableJetifier=true
# Built-in Kotlin (required for Flutter 3.44+ plugin compatibility)
android.builtInKotlin=true
android.newDsl=false
