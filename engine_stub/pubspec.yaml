name: begzar_engine
description: >-
  A stand-in for Begzar's private proxy engine, so the app builds and runs
  without it. It connects nothing and reaches no backend.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.5.1
  flutter: '>=3.3.0'

# The engine's own dependencies, unused here, so that the app resolves to the
# same versions on either engine and pubspec.lock does not move between them.
# scripts/check_engine_stub.sh fails when they drift from the engine's.
dependencies:
  flutter:
    sdk: flutter
  grpc: ^5.1.0
  protobuf: ^6.0.0
  flutter_local_notifications: ^22.0.1
  permission_handler: ^12.0.1
  fixnum: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
